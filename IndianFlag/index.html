<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flag</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
         .indianFlag {
            height: 100vh;
            width: 100vw;
            background-color: azure;
            border: 1px solid transparent;
            border-radius: 2px;
        }

        .flagBox {
            height: 33%;
            width: 100%;

        }

        .red {
            background-color: #ea590b;
        }

        .white {
            height: 34%;
            background-color: whitesmoke;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .green {
            background-color: green;
        }

        .chakra {
            height: 95%;
            width: 15.5%;
            border: 4px solid blue;
            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;
        }

        .chakraMid {
            height: 5%;
            width: 5%;
            border: 1px solid blue;
            border-radius: 50%;
            background-color: rgb(18, 30, 102);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tilli {
            position: absolute;
            height: 2px;
            width: 213px;
            left: 0;
            background-color: rgb(18, 30, 102);
            
        }
.tilli1{
rotate: calc(30deg);
}
.tilli2{
rotate: calc(60deg);
}
.tilli3{
rotate: calc(90deg);
}
.tilli4{
rotate: calc(120deg);
}
.tilli5{
rotate: calc(150deg);
}
.tilli6{
rotate: calc(180deg);
}

@keyframes gradient {
  0% {
    background-position: 0% 50%;
  }
  50% {
    background-position: 100% 50%;
  }
  100% {
    background-position: 0% 50%;
  }
}

.animated-gradient {
  background: linear-gradient(15deg, #e65e2c, #bc3199, #eb532d);
  background-size: 200% 200%;
  animation: gradient 20s ease infinite;
}

.animated-gradienttt{
  background: linear-gradient(15deg, #cfdfe1, #e1dcc6, #d1e7bc);
  background-size: 200% 200%;
  animation: gradient 20s ease infinite;
}
.animated-gradientt {
  background: linear-gradient(15deg, #55e23c, #3feaa8, #8ae035);
  background-size: 200% 200%;
  animation: gradient 20s ease infinite;
}

    </style>
</head>
<body>
     <section>
            <h2>India==Bharat==JammuDipe==Aryavarte==Hindustan</h2>
            <div class="indianFlag">
                <div class="flagBox red animated-gradient"></div>
                <div class="flagBox white animated-gradienttt">
                    <div class="chakra">
                        <div class="chakraMid">
                            <div class="tilli tilli1"></div>
                            <div class="tilli tilli2"></div>
                            <div class="tilli tilli3"></div>
                            <div class="tilli tilli4"></div>
                            <div class="tilli tilli5"></div>
                            <div class="tilli tilli6"></div>
                           
                        </div>
                    </div>
                </div>
                <div class="flagBox green animated-gradientt"></div>
            </div>
        </section>
</body>
</html>
